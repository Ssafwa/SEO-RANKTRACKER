name: Deploy to Render

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "RENDER_API_KEY and RENDER_SERVICE_ID must be set in repository secrets."
            exit 1
          fi
          echo "Triggering deploy for service: $RENDER_SERVICE_ID"
          resp=$(curl -sS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' )
          echo "$resp" > deploy_response.json
          echo "Deploy response:"
          cat deploy_response.json
          deploy_id=$(echo "$resp" | jq -r .id)
          if [ "$deploy_id" = "null" ] || [ -z "$deploy_id" ]; then
            echo "Failed to trigger deploy. Response:"
            cat deploy_response.json
            exit 1
          fi
          echo "Triggered deploy id: $deploy_id"
          echo "Polling deploy status..."
          for i in {1..60}; do
            status=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" "https://api.render.com/v1/deploys/${deploy_id}" | jq -r .status)
            echo "status: $status"
            if [ "$status" = "success" ] || [ "$status" = "failed" ] || [ "$status" = "active" ]; then
              break
            fi
            sleep 5
          done
          curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" "https://api.render.com/v1/deploys/${deploy_id}" | jq .

      - name: Show recent build logs (if available)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          deploy_id=$(jq -r .id deploy_response.json)
          build_id=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" "https://api.render.com/v1/deploys/${deploy_id}" | jq -r .build.id)
          echo "build id: $build_id"
          if [ "$build_id" = "null" ] || [ -z "$build_id" ]; then
            echo "No build id yet."
            exit 0
          fi
          logs_url="https://api.render.com/v1/builds/${build_id}/logs"
          echo "Fetching logs from: $logs_url"
          curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" "$logs_url" | jq -r .
